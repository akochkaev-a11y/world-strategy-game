name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install GeoJSON validation dependencies
        shell: bash
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates
          python3 --version

      - name: Download and validate country boundaries
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
          with urllib.request.urlopen(url, timeout=30) as response:
              Path('/tmp/all_countries.geojson').write_bytes(response.read())

          wanted = ["RU","UA","PL","FR","DE","GB","CN","IN","IR","JP","KZ","SA","ID","MN","PK","TR","MM","AF","YE","TH","ES","TM","SE","UZ","IQ","NO","FI","VN","MY","OM"]
          wanted_set = set(wanted)
          a3 = {"FRA":"FR","RUS":"RU","UKR":"UA","POL":"PL","DEU":"DE","GBR":"GB","CHN":"CN","IND":"IN","IRN":"IR","JPN":"JP","KAZ":"KZ","SAU":"SA","IDN":"ID","MNG":"MN","PAK":"PK","TUR":"TR","MMR":"MM","AFG":"AF","YEM":"YE","THA":"TH","ESP":"ES","TKM":"TM","SWE":"SE","UZB":"UZ","IRQ":"IQ","NOR":"NO","FIN":"FI","VNM":"VN","MYS":"MY","OMN":"OM"}
          data = json.loads(Path('/tmp/all_countries.geojson').read_text())
          selected = {}
          for feature in data.get('features', []):
              p = feature.get('properties') or {}
              iso = p.get('ISO_A2')
              if not iso or iso == '-99':
                  iso = p.get('ISO_A2_EH')
              if not iso or iso == '-99':
                  iso = a3.get(p.get('ADM0_A3'), '')
              geom = feature.get('geometry') or {}
              if iso in wanted_set and geom.get('type') in ('Polygon','MultiPolygon'):
                  if iso in selected:
                      raise SystemExit(f'duplicate playable country geometry: {iso}')
                  selected[iso] = feature
          missing = wanted_set - set(selected)
          extra = set(selected) - wanted_set
          if missing or extra or len(selected) != 30:
              raise SystemExit(f'geometry validation failed: count={len(selected)} missing={sorted(missing)} extra={sorted(extra)}')
          out = {'type':'FeatureCollection','features':[selected[iso] for iso in wanted]}
          Path('eurasia_countries.json').write_text(json.dumps(out, separators=(',',':')))
          print('Validated playable geometries:', ','.join(wanted))
          print('Playable geometry count:', len(out['features']))
          PY
          test -s eurasia_countries.json

      - name: Setup Godot
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates" build
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          godot --headless --editor --path . --quit || true
          SETTINGS="$(find "$HOME/.config/godot" -maxdepth 1 -type f -name 'editor_settings-*.tres' | head -n 1)"
          echo "Godot settings file: $SETTINGS"
          test -n "$SETTINGS"
          if grep -q '^export/android/java_sdk_path' "$SETTINGS"; then
            sed -i 's#^export/android/java_sdk_path.*#export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"#' "$SETTINGS"
          else
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          fi
          if grep -q '^export/android/android_sdk_path' "$SETTINGS"; then
            sed -i 's#^export/android/android_sdk_path.*#export/android/android_sdk_path = "/usr/lib/android-sdk"#' "$SETTINGS"
          else
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          fi
          godot --version
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

      - name: Ensure Android SDK packages for Godot 4.3
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find /usr/lib/android-sdk -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android SDK package installation failed after 3 attempts."
              exit 1
            fi
            sleep 5
          done
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/platforms/android-34"

      - name: Create debug keystore
        shell: bash
        run: |
          set -e
          if [ ! -f /root/debug.keystore ]; then
            keytool -genkeypair -keystore /root/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore /root/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Diagnose project and Android export
        shell: bash
        run: |
          set +e
          godot --headless --editor --verbose --path . --quit 2>&1 | tee /tmp/editor.log
          godot --headless --verbose --path . --export-debug "Android" "build/diagnostic.apk" 2>&1 | tee /tmp/export.log
          EXPORT_RC=${PIPESTATUS[0]}
          grep -Ei 'error|warn|android|sdk|jdk|java|keystore|template|export|invalid|missing' /tmp/editor.log /tmp/export.log || true
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/editor.log /tmp/export.log; then
            echo 'GDScript validation failed.'
            exit 1
          fi
          exit "$EXPORT_RC"

      - name: Build APK
        shell: bash
        run: |
          set -e
          godot --headless --verbose --path . --export-debug "Android" "build/Geostrategy-v0.1-debug.apk"
          test -s "build/Geostrategy-v0.1-debug.apk"
          ls -lh "build/Geostrategy-v0.1-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geostrategy-Android-APK
          path: build/Geostrategy-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 14
