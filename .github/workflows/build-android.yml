name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Godot Android
        shell: bash
        run: |
          set -e
          mkdir -p build
          mkdir -p /root/.config/godot

          cat > /root/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          ls -l /root/debug.keystore
          java -version
          godot --version

      - name: Build APK
        shell: bash
        run: |
          set -e
          godot --headless --verbose --path . \
            --export-debug "Android" \
            "build/Geostrategy-v0.1-debug.apk"

          test -s "build/Geostrategy-v0.1-debug.apk"
          ls -lh "build/Geostrategy-v0.1-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geostrategy-Android-APK
          path: build/Geostrategy-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 14
