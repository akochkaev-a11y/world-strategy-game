name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p build

          cp -a /root/.config/godot/. "$HOME/.config/godot/"

          cp -a \
            /root/.local/share/godot/export_templates/4.3.stable \
            "$HOME/.local/share/godot/export_templates/"

          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
            >> "$HOME/.config/godot/editor_settings-4.3.tres"

          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' \
            >> "$HOME/.config/godot/editor_settings-4.3.tres"

          godot --version
          java -version

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find /usr/lib/android-sdk -type f -name sdkmanager | head -n 1)"

          echo "sdkmanager: $SDKMANAGER"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root=/usr/lib/android-sdk \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root=/usr/lib/android-sdk \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          ls -lah /usr/lib/android-sdk/build-tools/
          ls -lah /usr/lib/android-sdk/platforms/

      - name: Build APK
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            "build/Geostrategy-v0.1-debug.apk"

          test -s "build/Geostrategy-v0.1-debug.apk"
          ls -lh "build/Geostrategy-v0.1-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geostrategy-Android-APK
          path: build/Geostrategy-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 14
