name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates" build
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"

          # Initialize the editor once, then locate the settings file Godot actually uses.
          godot --headless --editor --path . --quit || true
          SETTINGS="$(find "$HOME/.config/godot" -maxdepth 1 -type f -name 'editor_settings-*.tres' | head -n 1)"
          echo "Godot settings file: $SETTINGS"
          test -n "$SETTINGS"

          if grep -q '^export/android/java_sdk_path' "$SETTINGS"; then
            sed -i 's#^export/android/java_sdk_path.*#export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"#' "$SETTINGS"
          else
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          fi
          if grep -q '^export/android/android_sdk_path' "$SETTINGS"; then
            sed -i 's#^export/android/android_sdk_path.*#export/android/android_sdk_path = "/usr/lib/android-sdk"#' "$SETTINGS"
          else
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          fi

          echo '=== Godot version ==='
          godot --version
          echo '=== Config files ==='
          ls -lah "$HOME/.config/godot/"
          echo '=== Android editor settings ==='
          grep -n 'export/android' "$SETTINGS" || true
          echo '=== Export templates ==='
          ls -lah "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk"

      - name: Install complete Android toolchain for Godot 4.3
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find /usr/lib/android-sdk -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" \
            "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

      - name: Create debug keystore
        shell: bash
        run: |
          set -e
          if [ ! -f /root/debug.keystore ]; then
            keytool -genkeypair -keystore /root/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -keystore /root/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Diagnose project and Android export
        shell: bash
        run: |
          set +e
          echo '=== export_presets.cfg ==='
          cat export_presets.cfg
          echo '=== project import/editor validation ==='
          godot --headless --editor --verbose --path . --quit 2>&1 | tee /tmp/editor.log
          echo "editor exit=${PIPESTATUS[0]}"
          echo '=== Android export diagnostic ==='
          godot --headless --verbose --path . --export-debug "Android" "build/diagnostic.apk" 2>&1 | tee /tmp/export.log
          EXPORT_RC=${PIPESTATUS[0]}
          echo "export exit=$EXPORT_RC"
          echo '=== Relevant diagnostic lines ==='
          grep -Ei 'error|warn|android|sdk|jdk|java|keystore|template|export|invalid|missing' /tmp/editor.log /tmp/export.log || true
          exit 0

      - name: Build APK
        shell: bash
        run: |
          set -e
          godot --headless --verbose --path . --export-debug "Android" "build/Geostrategy-v0.1-debug.apk"
          test -s "build/Geostrategy-v0.1-debug.apk"
          ls -lh "build/Geostrategy-v0.1-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Geostrategy-Android-APK
          path: build/Geostrategy-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 14
